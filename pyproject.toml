[project]
name = "urdf2mjcf"
version = "0.2.0"
description = "URDF to MJCF conversion tool with mesh processing and optional decomposition"
readme = "README.md"
authors = [
    { name = "TangChaoBanLi-TDC" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0",
    "pycollada>=0.9.3",
    "trimesh>=3.12.0",
]

[project.scripts]
urdf2mjcf = "urdf2mjcf.cli:main"

[project.optional-dependencies]
coacd = [
    "coacd>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=0.990",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.0.250",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
